<!-- Komponen: Pengelola Unduhan (Download Manager) Mandiri -->
<section id="downloadsSection" class="view-section" style="display: none;">
  <!-- Header Halaman Unduhan -->
  <div class="dl-page-header">
    <div class="dl-title-wrap">
      <div class="dl-title-icon">
        <svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M7.5 12 12 16.5m0 0 4.5-4.5M12 16.5V3"/>
        </svg>
      </div>
      <div>
        <h2 class="feed-title">Pengelola Unduhan</h2>
        <p class="dl-subtitle" id="dlSummaryText">0 unduhan aktif • Berkas tersimpan di folder Downloads</p>
      </div>
    </div>

    <div class="dl-header-actions">
      <button id="openFolderBtn" class="dl-action-btn dl-btn-outline" title="Buka folder Downloads di Windows File Explorer">
        <svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12.75V12A2.25 2.25 0 014.5 9.75h15A2.25 2.25 0 0121.75 12v.75m-8.69-6.44l-2.12-2.12a1.5 1.5 0 00-1.061-.44H4.5A2.25 2.25 0 002.25 6v12a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18V9a2.25 2.25 0 00-2.25-2.25h-5.379a1.5 1.5 0 01-1.06-.44z"/>
        </svg>
        <span>Buka Folder</span>
      </button>

      <button id="clearCompletedBtn" class="dl-action-btn dl-btn-ghost" title="Bersihkan riwayat unduhan yang sudah selesai atau dibatalkan">
        <svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0"/>
        </svg>
        <span>Bersihkan Selesai</span>
      </button>
    </div>
  </div>

  <!-- Filter Status Tab -->
  <div class="dl-filter-bar">
    <button class="dl-tab-btn active" data-filter="all">Semua (<span id="countAll">0</span>)</button>
    <button class="dl-tab-btn" data-filter="active">Sedang Berjalan (<span id="countActive">0</span>)</button>
    <button class="dl-tab-btn" data-filter="completed">Selesai (<span id="countCompleted">0</span>)</button>
  </div>

  <!-- Daftar Kartu Tugas Unduhan -->
  <div id="downloadsList" class="dl-tasks-container"></div>

  <!-- State Jika Belum Ada Unduhan -->
  <div id="emptyDownloadsState" class="empty-state" style="display: none;">
    <div class="empty-icon">
      <svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M7.5 12 12 16.5m0 0 4.5-4.5M12 16.5V3"/>
      </svg>
    </div>
    <h3>Belum Ada Unduhan</h3>
    <p>Unduh video dari kartu video di beranda atau player untuk ditonton secara offline kapan saja.</p>
  </div>
</section>
