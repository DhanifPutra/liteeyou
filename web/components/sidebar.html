<!-- Komponen: Sidebar Menu Navigasi & Bookmark Channel -->
<aside class="sidebar" id="sidebar">
  <!-- Menu Navigasi Utama -->
  <div class="sidebar-section">
    <h4 class="sidebar-title">NAVIGASI</h4>
    <button class="side-link active" id="sideHomeBtn">
      <svg class="ui-icon icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12l8.954-8.955a1.125 1.125 0 011.591 0L21.75 12M4.5 9.75V19.5a.75.75 0 00.75.75h4.5v-4.5a.75.75 0 01.75-.75h3a.75.75 0 01.75.75v4.5h4.5a.75.75 0 00.75-.75V9.75"/></svg>
      <span>Beranda</span>
    </button>
    <button class="side-link" id="sideHistoryBtn">
      <svg class="ui-icon icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      <span>Riwayat Tontonan</span>
    </button>
    <button class="side-link" id="sideDownloadsBtn">
      <svg class="ui-icon icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M7.5 12 12 16.5m0 0 4.5-4.5M12 16.5V3"/></svg>
      <span>Unduhan</span>
      <span id="sideDownloadsBadge" class="side-badge" style="display:none;">0</span>
    </button>
  </div>

  <div class="sidebar-divider"></div>

  <!-- Menu Channel Favorit / Bookmarks -->
  <div class="sidebar-section">
    <div class="section-header-row">
      <h4 class="sidebar-title"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M11.48 3.499a.562.562 0 011.04 0l2.125 5.111a.563.563 0 00.475.345l5.518.442a.563.563 0 01.321.99l-4.204 3.602a.563.563 0 00-.182.557l1.285 5.386a.563.563 0 01-.84.61l-4.725-2.885a.563.563 0 00-.586 0l-4.725 2.885a.563.563 0 01-.84-.61l1.285-5.386a.563.563 0 00-.182-.557L3.04 10.387a.563.563 0 01.321-.99l5.518-.442a.563.563 0 00.475-.345l2.125-5.111z"/></svg> CHANNEL FAVORIT</h4>
      <button id="addChannelBtn" class="mini-btn" title="Tambah Bookmark Channel"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg></button>
    </div>
    <div id="channelList" class="channel-list">
      <!-- Diisi secara otomatis oleh JavaScript -->
      <div class="channel-empty">Memuat channel favorit...</div>
    </div>
  </div>

  <!-- Footer Sidebar -->
  <div class="sidebar-footer">
    <p class="lite-badge"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M12.75 2.25L5.25 12h6l-.75 9.75L18.75 12h-6l.75-9.75z"/></svg> YouTube Lite • Ringan & Cepat</p>
  </div>
</aside>
