<!-- Komponen: Modal Tambah Bookmark Channel -->
<div id="channelModal" class="modal-overlay" style="display:none;">
  <div class="modal-box">
    <div class="modal-header">
      <h3><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M11.48 3.499a.562.562 0 011.04 0l2.125 5.111a.563.563 0 00.475.345l5.518.442a.563.563 0 01.321.99l-4.204 3.602a.563.563 0 00-.182.557l1.285 5.386a.563.563 0 01-.84.61l-4.725-2.885a.563.563 0 00-.586 0l-4.725 2.885a.563.563 0 01-.84-.61l1.285-5.386a.563.563 0 00-.182-.557L3.04 10.387a.563.563 0 01.321-.99l5.518-.442a.563.563 0 00.475-.345l2.125-5.111z"/></svg> Tambah Bookmark Channel</h3>
      <button id="closeModalBtn" class="close-btn" title="Tutup"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg></button>
    </div>
    <div class="modal-body">
      <label for="channelHandleInput">Nama Channel, Handle YouTube (@nama), atau URL Channel:</label>
      <input type="text" id="channelHandleInput" placeholder="Contoh: @BroCodez atau @Fireship" autocomplete="off">
    </div>
    <div class="modal-footer">
      <button id="cancelModalBtn" class="btn btn-secondary">Batal</button>
      <button id="saveChannelModalBtn" class="btn btn-primary">Simpan Channel</button>
    </div>
  </div>
</div>
