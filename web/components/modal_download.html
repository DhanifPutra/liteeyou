<!-- Komponen: Modal Pilihan Format & Resolusi Unduhan -->
<div id="downloadModal" class="modal-overlay" style="display:none;">
  <div class="modal-box dl-modal-box">
    <div class="modal-header">
      <h3>
        <svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M7.5 12 12 16.5m0 0 4.5-4.5M12 16.5V3"/>
        </svg>
        Pilih Format & Resolusi Unduh
      </h3>
      <button id="closeDlModalBtn" class="close-btn" title="Tutup">
        <svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <div class="modal-body">
      <!-- Pratinjau Video -->
      <div class="dl-modal-preview">
        <div class="dl-modal-thumb-wrap">
          <img id="dlModalThumb" src="" alt="Thumbnail" class="dl-modal-thumb">
        </div>
        <div class="dl-modal-details">
          <h4 id="dlModalTitle" class="dl-modal-title">Judul Video</h4>
          <span id="dlModalChannel" class="dl-modal-sub">Channel YouTube</span>
        </div>
      </div>

      <!-- Pilihan Format (MP4 Video / MP3 Audio) -->
      <label class="dl-field-label">Pilih Format Berkas:</label>
      <div class="dl-format-options">
        <label class="dl-format-card active" id="dlOptionVideoLabel">
          <input type="radio" name="dlFormatType" id="dlFormatVideo" value="mp4" checked>
          <div class="dl-format-icon icon-video">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M6 3v18M18 3v18M3 9h3m-3 6h3m12-6h3m-3 6h3M5.25 3h13.5A2.25 2.25 0 0 1 21 5.25v13.5A2.25 2.25 0 0 1 18.75 21H5.25A2.25 2.25 0 0 1 3 18.75V5.25A2.25 2.25 0 0 1 5.25 3Z"/></svg>
          </div>
          <div class="dl-format-text">
            <strong>Video (MP4)</strong>
            <span>Audio & Video utuh dalam 1 berkas</span>
          </div>
        </label>

        <label class="dl-format-card" id="dlOptionAudioLabel">
          <input type="radio" name="dlFormatType" id="dlFormatAudio" value="mp3">
          <div class="dl-format-icon icon-audio">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"/></svg>
          </div>
          <div class="dl-format-text">
            <strong>Audio Musik (MP3)</strong>
            <span>Berkas MP3 kualitas audio terbaik</span>
          </div>
        </label>
      </div>

      <!-- Pilihan Resolusi (Khusus Video MP4) -->
      <div id="dlResolutionRow" class="dl-res-section">
        <label for="dlResolutionSelect" class="dl-field-label">Pilih Resolusi Video:</label>
        <select id="dlResolutionSelect" class="dl-select">
          <option value="1080">1080p — Full HD (Kualitas Tertinggi)</option>
          <option value="720" selected>720p — HD (Rekomendasi Seimbang)</option>
          <option value="480">480p — SD (Standar)</option>
          <option value="360">360p — Hemat Kuota & Cepat</option>
        </select>
      </div>
    </div>

    <div class="modal-footer">
      <button id="cancelDlModalBtn" class="btn btn-secondary">Batal</button>
      <button id="confirmDownloadBtn" class="btn btn-primary">
        <svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M7.5 12 12 16.5m0 0 4.5-4.5M12 16.5V3"/></svg>
        Mulai Download
      </button>
    </div>
  </div>
</div>
